<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brad's Board</title>
<style>
:root{--bg:#0A0A0A;--card:#121212;--col:#0F0F0F;--bd:#262626;--ac:#3B82F6;--tx:#EDEDED;--mu:#8A8A8A;--r:8px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
h1 span{color:var(--mu);font-weight:400;font-size:13px;margin-left:8px}
.sp{flex:1}
button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
button:hover,.btn:hover{border-color:#3a3a3a;background:#171717}
button.primary{background:var(--ac);border-color:var(--ac);color:#fff}button.primary:hover{background:#2f6fd9}
button.ghost{background:transparent}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.seg button{border:none;border-radius:0;background:var(--card);padding:7px 14px}
.seg button.on{background:var(--ac);color:#fff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--bd);background:#0c0c0c}
.toolbar .label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:12px;cursor:pointer;color:var(--tx);user-select:none}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.chip.on{border-color:var(--ac);background:rgba(59,130,246,.14);color:#fff}
.chip.toggle.on{border-color:#22C55E;background:rgba(34,197,94,.12)}
.chip .n{color:var(--mu)}
.chip.exit{border-style:dashed}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--bd)}
.pipe-bar{display:none;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--bd);background:rgba(59,130,246,.06)}
.pipe-bar.show{display:flex}
.pipe-bar h2{margin:0;font-size:15px;font-weight:600}
.pipe-bar h2 .hint{color:var(--mu);font-weight:400;font-size:12px;margin-left:8px}
main{flex:1;display:flex;gap:12px;padding:16px 20px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 290px;background:var(--col);border:1px solid var(--bd);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col h2{font-size:13px;margin:0;padding:12px 12px 10px;display:flex;align-items:center;gap:8px;font-weight:600;border-bottom:1px solid var(--bd)}
.col h2 .cnt{color:var(--mu);font-weight:400;background:#1a1a1a;border-radius:999px;padding:0 8px;font-size:12px}
.col h2 .add{margin-left:auto;padding:0 8px;font-size:16px;line-height:22px;border:none;background:none;color:var(--mu)}
.col h2 .add:hover{color:var(--tx)}
.col.urgent{border-color:#EF4444;flex-basis:330px}.col.urgent h2{color:#FCA5A5}
.col.todo h2{color:#93C5FD}.col.doing h2{color:#FCD34D}.col.delegating h2{color:#D8B4FE}
.col.not_urgent h2{color:#9CA3AF}.col.done h2{color:#86EFAC}
.list{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:80px;flex:1}
.list.over{background:rgba(59,130,246,.06);outline:1px dashed var(--ac);outline-offset:-4px;border-radius:var(--r)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px 11px;cursor:grab;position:relative}
.card:hover{border-color:#3a3a3a}.card.dragging{opacity:.4}
.card .top{display:flex;gap:8px;align-items:flex-start}
.tick{flex:0 0 18px;height:18px;border-radius:50%;border:1.5px solid #4a4a4a;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:none;padding:0}
.tick:hover{border-color:var(--ac)}
.card.isdone .tick{background:#22C55E;border-color:#22C55E}
.card.isdone .tick::after{content:"";width:5px;height:9px;border:solid #0A0A0A;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.card.isdone .title{color:var(--mu);text-decoration:line-through}
.title{font-weight:560;font-size:13.5px;flex:1;padding-right:28px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:550}
.stage{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.stage-urgent{background:rgba(239,68,68,.16);color:#FCA5A5;border:1px solid rgba(239,68,68,.4)}
.stage-todo{background:rgba(59,130,246,.16);color:#93C5FD;border:1px solid rgba(59,130,246,.35)}
.stage-doing{background:rgba(245,158,11,.14);color:#FCD34D;border:1px solid rgba(245,158,11,.35)}
.stage-delegating{background:rgba(168,85,247,.14);color:#D8B4FE;border:1px solid rgba(168,85,247,.35)}
.stage-not_urgent{background:rgba(107,114,128,.14);color:#9CA3AF;border:1px solid rgba(107,114,128,.35)}
.stage-done{background:rgba(34,197,94,.14);color:#86EFAC;border:1px solid rgba(34,197,94,.35)}
.due{font-size:11px;padding:2px 8px;border-radius:999px;background:#1c1c1c;border:1px solid var(--bd);color:#cfcfcf}
.due.soon{background:rgba(239,68,68,.14);border-color:#5b2323;color:#FCA5A5}
.due.today{background:#EF4444;border-color:#EF4444;color:#fff}
.note{color:#B5B5B5;font-size:12.5px;margin-top:7px}
.src{color:#666;font-size:11px;margin-top:7px;word-break:break-word}
.card-tools{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0}
.card:hover .card-tools,.card.menu-open .card-tools{opacity:1}
.card-tools button{border:none;background:#1c1c1c;padding:2px 7px;font-size:12px;border-radius:6px;color:var(--mu)}
.card-tools button:hover{color:var(--tx);background:#252525}
.menu{position:absolute;top:30px;right:6px;background:#161616;border:1px solid var(--bd);border-radius:var(--r);min-width:160px;padding:4px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;color:var(--tx);padding:7px 10px;font-size:12px;border-radius:6px}
.menu button:hover{background:#222}
.menu .sep{height:1px;background:var(--bd);margin:4px 0}
.menu .lab{font-size:10px;color:var(--mu);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:min(520px,92vw);padding:20px}
.modal h3{margin:0 0 14px;font-size:16px}
.modal label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;background:#0d0d0d;border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);padding:8px 10px;font:inherit;font-size:13px}
.modal textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
.actions{display:flex;gap:8px;margin-top:16px}.actions .sp{flex:1}
button.danger{color:#FCA5A5}
.search{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);padding:7px 10px;font:inherit;font-size:13px;width:200px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#262626;border-radius:8px}
.empty{color:var(--mu);font-size:12px;padding:16px 8px;text-align:center}

.ask-badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:650;background:rgba(251,191,36,.16);color:#FCD34D;border:1px solid rgba(251,191,36,.45);letter-spacing:.02em}
.ask-badge.answered{background:rgba(45,212,191,.14);color:#5EEAD4;border-color:rgba(45,212,191,.45)}
.ask-open{border-color:rgba(251,191,36,.55);box-shadow:inset 0 0 0 1px rgba(251,191,36,.12)}
.ask-answered{border-color:rgba(45,212,191,.45);box-shadow:inset 0 0 0 1px rgba(45,212,191,.1)}
.ask-preview{margin-top:7px;padding:7px 9px;border-radius:6px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);font-size:12px;color:#FDE68A}
.ask-preview.answered{background:rgba(45,212,191,.08);border-color:rgba(45,212,191,.28);color:#99F6E4}
.ask-preview .lab{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#B45309;margin-bottom:2px;font-weight:650}
.ask-preview.answered .lab{color:#0F766E}
.ask-preview .ans{margin-top:6px;padding-top:6px;border-top:1px solid rgba(45,212,191,.22);color:#CCFBF1;font-size:12px}
.tip{font-size:11.5px;color:var(--mu);padding:0 20px 8px;border-bottom:1px solid var(--bd);background:#0c0c0c}
.tip b{color:#5EEAD4;font-weight:550}
.sync-pill{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mu)}
.sync-pill.ok{color:#86EFAC;border-color:rgba(34,197,94,.45)}
.sync-pill.busy{color:#FCD34D;border-color:rgba(251,191,36,.4)}
.sync-pill.err{color:#FCA5A5;border-color:rgba(239,68,68,.4)}
.modal.ask-modal textarea{min-height:90px}
.ask-answer-box{margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.28);font-size:13px;color:#CCFBF1;white-space:pre-wrap}
.ask-answer-box .lab{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#0F766E;margin-bottom:4px;font-weight:650}
</style>

<header>
 <h1>Brad's Board <span id="sub"></span></h1>
 <div class="sp"></div>
 <span class="sync-pill busy" id="syncPill">Connecting…</span>
 <input class="search" id="q" placeholder="Search cards…">
 <div class="seg" id="viewSeg">
  <button type="button" data-view="board" class="on">Board</button>
  <button type="button" data-view="pipeline">Pipeline</button>
 </div>
 <button class="primary" id="addBtn">+ Add card</button>
 <button id="expBtn">Export JSON</button>
 <label class="btn">Import JSON<input type="file" id="imp" accept=".json,application/json" hidden></label>
 <button id="resetBtn" title="Reload board from live server">Reload live</button>
</header>
<div class="tip"><b>Live sync on</b> — Ask stays on the card; answers appear here when Brad OS writes them. Bookmark this HTTPS link.</div>
<div class="toolbar" id="toggles">
 <span class="label">Show</span>
 <span class="chip toggle on" data-tog="hideDone">Hide completed</span>
 <span class="chip toggle" data-tog="showParked">Show parked</span>
</div>
<div class="filters" id="filters"></div>
<div class="pipe-bar" id="pipeBar">
 <h2 id="pipeTitle">Pipeline</h2>
 <div class="sp"></div>
 <button class="ghost" id="exitPipe">← Back to Board</button>
</div>
<main id="board"></main>
<div class="overlay" id="ov"><div class="modal">
 <h3 id="mt">Edit card</h3>
 <label>Title</label><input id="f_title">
 <div class="row"><div><label>Project</label><select id="f_project"></select></div>
 <div><label>Column / Stage</label><select id="f_column"></select></div></div>
 <div class="row"><div><label>Due date</label><input id="f_due" type="date"></div>
 <div><label>Due (text, if no exact date)</label><input id="f_dueText" placeholder="e.g. Nov 2026"></div></div>
 <label>Note</label><textarea id="f_note"></textarea>
 <label>Source</label><input id="f_source">
 <div class="actions"><button class="danger" id="delBtn">Delete</button><div class="sp"></div><button id="canBtn">Cancel</button><button class="primary" id="saveBtn">Save</button></div>
</div></div>
<div class="overlay" id="askOv"><div class="modal ask-modal">
 <h3 id="askMt">Ask Brad OS</h3>
 <p style="margin:0 0 8px;font-size:12px;color:var(--mu)" id="askCardTitle"></p>
 <label>Your question</label>
 <textarea id="f_ask" placeholder="Ask Brad OS…"></textarea>
 <div id="askAnswerBox" class="ask-answer-box" style="display:none"><div class="lab">Answer</div><div id="askAnswerText"></div></div>
 <div class="actions">
  <button class="danger" id="askClearBtn" style="display:none">Clear ask</button>
  <div class="sp"></div>
  <button id="askCanBtn">Cancel</button>
  <button class="primary" id="askSaveBtn">Save ask</button>
 </div>
</div></div>

const ROW_ID='main';

const STAGE_LABEL={urgent:'Urgent',todo:'To do',doing:'Doing',delegating:'Delegating',not_urgent:'Not urgent',done:'Done'};
const PIPE_STAGES=['urgent','todo','doing','delegating','not_urgent','done'];
const MOVE_TO=PIPE_STAGES;
const MIGRATE={focus:'urgent',week:'urgent',next:'todo',later:'not_urgent',others:'not_urgent',approval:'delegating',parked:'not_urgent',done:'done'};
function migrate(s){s.columns=PIPE_STAGES.map(id=>({id,name:STAGE_LABEL[id]}));(s.tasks||[]).forEach(t=>{let c=t.column||'todo';if(c==='parked')t.parked=true;if(!STAGE_LABEL[c])t.column=MIGRATE[c]||'todo';if(t.prevColumn&&!STAGE_LABEL[t.prevColumn])t.prevColumn=MIGRATE[t.prevColumn]||'todo';if(t.done)t.column='done'});return s}

const sb = (window.supabase && supabase.createClient)
  ? supabase.createClient(SB_URL, SB_ANON, {auth:{persistSession:false,autoRefreshToken:false}})
  : null;

let S=migrate(JSON.parse(JSON.stringify(SEED)));
let UI=loadUI();
let editing=null;
let openMenu=null;
let q='';
let syncState='offline'; // synced | saving | offline
let saveTimer=null;
let applyingRemote=false;
let lastRemoteSig='';
let bootDone=false;
const TODAY=new Date(new Date().toDateString());

function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadCached(){
 try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tasks)return migrate(s)}catch(e){}
 return null;
}
function setSync(state,label){
 syncState=state;
 const el=$('syncPill');if(!el)return;
 el.className='sync-pill '+(state==='synced'?'ok':state==='saving'?'busy':'err');
 el.textContent=label||(state==='synced'?'Synced':state==='saving'?'Saving…':'Offline');
}
function boardSig(s){
 try{return JSON.stringify({u:s.updatedAt||null,n:(s.tasks||[]).length,asks:(s.tasks||[]).filter(t=>t.ask).map(t=>({id:t.id,st:t.ask.status,at:t.ask.at,aa:t.ask.answeredAt,tx:(t.ask.text||'').slice(0,40),an:(t.ask.answer||'').slice(0,40)}))})}catch(e){return String(Date.now())}
}
function openAsks(){
 return (S.tasks||[]).filter(t=>t.ask&&t.ask.status==='open'&&t.ask.text).map(t=>({
  id:t.id,title:t.title,project:t.project,column:t.column,ask:t.ask
 }));
}
function save(opts){
 const force=opts&&opts.force;
 cacheLocal();
 if(applyingRemote&&!force)return;
 setSync('saving');
 clearTimeout(saveTimer);
 saveTimer=setTimeout(pushRemote,400);
}
async function pushRemote(){
 if(!sb){setSync('offline','Offline');return}
 try{
  const payload={id:ROW_ID,data:S,updated_at:new Date().toISOString(),updated_by:'brad'};
  const {error}=await sb.from('brad_board_state').upsert(payload,{onConflict:'id'});
  if(error)throw error;
  lastRemoteSig=boardSig(S);
  setSync('synced');
 }catch(e){
  console.warn('push failed',e);
  setSync('offline','Offline — retrying');
  setTimeout(pushRemote,5000);
 }
}
async function pullRemote(opts){
 const silent=opts&&opts.silent;
 if(!sb){setSync('offline');return false}
 try{
  if(!silent)setSync('saving','Loading…');
  const {data,error}=await sb.from('brad_board_state').select('data,updated_at,updated_by').eq('id',ROW_ID).maybeSingle();
  if(error)throw error;
  if(data&&data.data&&data.data.tasks){
   const next=migrate(data.data);
   const sig=boardSig(next);
   if(sig!==lastRemoteSig){
    applyingRemote=true;
    S=next;
    lastRemoteSig=sig;
    cacheLocal();
    render();
    applyingRemote=false;
   }
   setSync('synced');
   return true;
  }
  // no row yet — push seed
  await pushRemote();
  return true;
 }catch(e){
  console.warn('pull failed',e);
  setSync('offline','Offline');
  return false;
 }
}
function subscribeRemote(){
 if(!sb)return;
 try{
  sb.channel('brad-board-live')
   .on('postgres_changes',{event:'*',schema:'public',table:'brad_board_state',filter:'id=eq.main'},payload=>{
    const row=payload.new||{};
    if(!row.data||!row.data.tasks)return;
    if(row.updated_by==='brad'&&syncState==='saving')return;
    const next=migrate(row.data);
    const sig=boardSig(next);
    if(sig===lastRemoteSig)return;
    applyingRemote=true;
    S=next;lastRemoteSig=sig;cacheLocal();render();
    applyingRemote=false;
    setSync('synced','Synced');
   })
   .subscribe((status)=>{
    if(status==='SUBSCRIBED'){/* keep */}
   });
 }catch(e){console.warn('realtime',e)}
 // polling fallback every 18s
 setInterval(()=>{if(document.visibilityState==='visible')pullRemote({silent:true})},18000);
}

function loadUI(){
 const d={hideDone:true,showParked:false,view:'board',project:null};

 return d;
}
function saveUI(){localStorage.setItem(UIKEY,JSON.stringify(UI))}
const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function colName(id){const c=(S.columns||[]).find(x=>x.id===id);return c?c.name:(STAGE_LABEL[id]||id)}
function fmtDue(t){
 if(t.due){const d=new Date(t.due+'T00:00:00');const diff=Math.round((d-TODAY)/864e5);
  const lab=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  let cls='due';if(diff<=0&&!t.done)cls+=' today';else if(diff<=7&&!t.done)cls+=' soon';
  const rel=t.done?'':diff===0?' · today':diff<0?' · overdue':diff===1?' · tomorrow':diff<=14?` · ${diff}d`:'';
  return `<span class="${cls}">${lab}${rel}</span>`}
 if(t.dueText)return `<span class="due">${esc(t.dueText)}</span>`;return '';
}
function matchesQ(t){
 if(!q)return true;
 const hay=(t.title+' '+(t.note||'')+' '+(t.source||'')+' '+(t.project||'')+' '+((t.ask&&t.ask.text)||'')+' '+((t.ask&&t.ask.answer)||'')).toLowerCase();
 return hay.includes(q);
}
function matchesProject(t){
 if(!UI.project)return true;
 return t.project===UI.project;
}
function matchesToggles(t){
 if(UI.hideDone&&(t.done||t.column==='done'))return false;
 if(!UI.showParked&&t.parked&&!t.done)return false;
 return true;
}
function visible(t){return matchesProject(t)&&matchesToggles(t)&&matchesQ(t)}

function moveTask(t,col){
 if(!t)return;
 if(col==='done'){if(!t.done){t.prevColumn=t.column;t.done=true}t.column='done'}
 else{t.column=col;t.done=false}
 save();render();
}

function card(t){

 const st=t.column||'todo';
 const askOpen=t.ask&&t.ask.status==='open'&&t.ask.text;
 const askAns=t.ask&&t.ask.status==='answered'&&t.ask.text;
 return `<div class="card ${t.done||st==='done'?'isdone':''} ${askOpen?'ask-open':''} ${askAns?'ask-answered':''}" draggable="true" data-id="${t.id}">
  <div class="card-tools">
   <button type="button" data-ask="${t.id}" title="Ask Brad OS">Ask</button>
   <button type="button" data-menu="${t.id}" title="Move / more">⋯</button>
   <button type="button" data-edit="${t.id}" title="Edit">Edit</button>
  </div>
  <div class="top"><button class="tick" data-tick="${t.id}" title="Mark done"></button><div class="title">${esc(t.title)}</div></div>
  <div class="meta">
   <span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color}"></span>
   <span class="tag" style="background:${p.color}22;color:${p.color};border:1px solid ${p.color}55">${esc(p.name)}</span>
   <span class="stage stage-${st}">${esc(STAGE_LABEL[st]||st)}</span>
   ${askOpen?'<span class="ask-badge">ASK</span>':''}
   ${askAns?'<span class="ask-badge answered">ANSWERED</span>':''}
   ${fmtDue(t)}
  </div>
  ${t.note?`<div class="note">${esc(t.note)}</div>`:''}
  ${askOpen?`<div class="ask-preview"><div class="lab">Open ask</div>${esc(t.ask.text)}</div>`:''}
  ${askAns?`<div class="ask-preview answered"><div class="lab">Ask · answered</div>${esc(t.ask.text)}${t.ask.answer?`<div class="ans">${esc(t.ask.answer)}</div>`:''}</div>`:''}
  ${t.source?`<div class="src">Source: ${esc(t.source)}</div>`:''}
 </div>`;
}

function renderFilters(){

 const counts={};
 S.tasks.forEach(t=>{
  if(t.done||t.column==='done')return;

  counts[t.project]=(counts[t.project]||0)+1;

 let html=`<span class="chip ${!UI.project?'on':''}" data-p="">All <span class="n">${openAll}</span></span>`;

  const n=counts[k]||0;

 }).join('');
 $('filters').innerHTML=html;
}

 renderToggles();
 renderFilters();
 const open=S.tasks.filter(t=>t.column!=='done'&&!t.parked&&!t.done).length;
 const wk=S.tasks.filter(t=>t.column==='urgent'&&!t.done).length;
 const asks=openAsks().length;
 const answered=(S.tasks||[]).filter(t=>t.ask&&t.ask.status==='answered').length;
 let sub=`${open} open · ${wk} urgent`;
 if(asks)sub+=` · ${asks} ask${asks===1?'':'s'}`;
 if(answered)sub+=` · ${answered} answered`;
 $('sub').textContent=sub;

 const isPipe=UI.view==='pipeline';
 $('pipeBar').classList.toggle('show',isPipe);
 if(isPipe){
  const pname=UI.project?(S.projects[UI.project]?.name||UI.project):'All open';
  $('pipeTitle').innerHTML=`Pipeline: ${esc(pname)} <span class="hint">drag cards between stages</span>`;
 }

 const cols=isPipe?pipeColumns():boardColumns();
 $('board').innerHTML=cols.map(c=>{
  const ts=S.tasks.filter(t=>t.column===c.id&&visible(t)).sort((a,b)=>(a.order??0)-(b.order??0));
  const body=ts.length?ts.map(card).join(''):`<div class="empty">Drop cards here</div>`;
  return `<section class="col ${c.id}"><h2>${esc(c.name)}<span class="cnt">${ts.length}</span><button class="add" data-add="${c.id}" title="Add card">+</button></h2>
  <div class="list" data-col="${c.id}">${body}</div></section>`;
 }).join('');
 openMenu=null;
 saveUI();
}

document.addEventListener('click',e=>{
 if(openMenu&&!e.target.closest('.menu')&&!e.target.closest('[data-menu]')){
  document.querySelectorAll('.menu').forEach(m=>m.remove());
  document.querySelectorAll('.menu-open').forEach(c=>c.classList.remove('menu-open'));
  openMenu=null;
 }

 const tog=e.target.closest('[data-tog]');
 if(tog){
  const k=tog.dataset.tog;
  UI[k]=!UI[k];
  saveUI();render();return;
 }

 const vb=e.target.closest('#viewSeg [data-view]');
 if(vb){
  UI.view=vb.dataset.view;
  saveUI();render();return;
 }

 if(e.target.closest('#exitPipe')){
  UI.view='board';UI.project=null;saveUI();render();return;
 }

 const f=e.target.closest('.chip[data-p]');
 if(f&&!f.dataset.tog){
  const p=f.dataset.p;
  if(!p){
   UI.project=null;
  }else if(UI.project===p&&UI.view==='pipeline'){
   UI.view='board';UI.project=null;
  }else{
   UI.project=p;
   UI.view='pipeline';
  }
  saveUI();render();return;
 }

 const tk=e.target.closest('[data-tick]');
 if(tk){
  const t=S.tasks.find(x=>x.id===tk.dataset.tick);
  if(!t)return;
  t.done=!t.done;
  if(t.done){t.prevColumn=t.column;t.column='done'}
  else{t.column=t.prevColumn&&t.prevColumn!=='done'?t.prevColumn:'todo'}
  save();render();return;
 }

 const askb=e.target.closest('[data-ask]');
 if(askb){openAskModal(S.tasks.find(x=>x.id===askb.dataset.ask));return}

 const ed=e.target.closest('[data-edit]');
 if(ed){openModal(S.tasks.find(x=>x.id===ed.dataset.edit));return}

 const ad=e.target.closest('[data-add]');
 if(ad){openModal(null,ad.dataset.add);return}

 const mb=e.target.closest('[data-menu]');
 if(mb){
  e.stopPropagation();
  const id=mb.dataset.menu;
  const cardEl=mb.closest('.card');
  document.querySelectorAll('.menu').forEach(m=>m.remove());
  document.querySelectorAll('.menu-open').forEach(c=>c.classList.remove('menu-open'));
  if(openMenu===id){openMenu=null;return}
  openMenu=id;
  cardEl.classList.add('menu-open');
  const t=S.tasks.find(x=>x.id===id);
  const menu=document.createElement('div');
  menu.className='menu';
  menu.innerHTML=`<div class="lab">Move to</div>`+
   MOVE_TO.map(c=>`<button type="button" data-move="${c}" ${t&&t.column===c?'style="color:var(--ac)"':''}>${esc(STAGE_LABEL[c]||c)}</button>`).join('')+
   `<div class="sep"></div><button type="button" data-ask="${id}">Ask Brad OS…</button><button type="button" data-edit="${id}">Edit details…</button>`;
  cardEl.appendChild(menu);
  return;
 }

 const mv=e.target.closest('[data-move]');
 if(mv){
  const cardEl=mv.closest('.card');
  const t=S.tasks.find(x=>x.id===cardEl.dataset.id);
  moveTask(t,mv.dataset.move);return;
 }
});

$('q').oninput=e=>{q=e.target.value.toLowerCase().trim();render()};
$('addBtn').onclick=()=>openModal(null,UI.view==='pipeline'?'urgent':'todo');

function openModal(t,col){
 editing=t;
 $('mt').textContent=t?'Edit card':'New card';
 $('f_project').innerHTML=Object.entries(S.projects).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');
 $('f_column').innerHTML=(S.columns||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 $('f_title').value=t?t.title:'';
 $('f_project').value=t?t.project:(UI.project||'money');
 $('f_column').value=t?t.column:(col||'todo');
 $('f_due').value=t&&t.due||'';
 $('f_dueText').value=t&&t.dueText||'';
 $('f_note').value=t?t.note||'':'';
 $('f_source').value=t?t.source||'':'Added by Bradley';
 $('delBtn').style.display=t?'':'none';
 $('ov').classList.add('show');
 setTimeout(()=>$('f_title').focus(),0);
}
function closeModal(){$('ov').classList.remove('show');editing=null}
$('canBtn').onclick=closeModal;
$('ov').onclick=e=>{if(e.target.id==='ov')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeAskModal();document.querySelectorAll('.menu').forEach(m=>m.remove())}});

$('saveBtn').onclick=()=>{
 const v={title:$('f_title').value.trim(),project:$('f_project').value,column:$('f_column').value,
  due:$('f_due').value||null,dueText:$('f_dueText').value.trim()||null,note:$('f_note').value.trim(),source:$('f_source').value.trim()};
 if(!v.title){$('f_title').focus();return}
 v.done=v.column==='done';
 if(editing)Object.assign(editing,v);
 else S.tasks.push({id:'u'+Date.now().toString(36),...v,order:-Date.now()});
 save();closeModal();render();
};
$('delBtn').onclick=()=>{if(editing&&confirm('Delete this card?')){S.tasks=S.tasks.filter(t=>t!==editing);save();closeModal();render()}};
$('expBtn').onclick=()=>{
 const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='brad-board-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
};

let askingId=null;
function openAskModal(t){
 if(!t)return;
 askingId=t.id;
 const answered=t.ask&&t.ask.status==='answered';
 $('askMt').textContent=answered?'Ask · answered':'Ask Brad OS';
 $('askCardTitle').textContent=t.title||'';
 $('f_ask').value=(t.ask&&t.ask.text)||'';
 $('f_ask').readOnly=!!answered;
 $('askSaveBtn').style.display=answered?'none':'';
 $('askClearBtn').style.display=(t.ask&&t.ask.text)?'':'none';
 if(answered&&t.ask.answer){
  $('askAnswerBox').style.display='';
  $('askAnswerText').textContent=t.ask.answer;
 }else{
  $('askAnswerBox').style.display='none';
  $('askAnswerText').textContent='';
 }
 $('askOv').classList.add('show');
 if(!answered)setTimeout(()=>$('f_ask').focus(),0);
}
function closeAskModal(){$('askOv').classList.remove('show');askingId=null;$('f_ask').readOnly=false;$('askSaveBtn').style.display=''}
function saveAskFromModal(){
 const t=S.tasks.find(x=>x.id===askingId);if(!t)return;
 const text=$('f_ask').value.trim();
 if(!text){$('f_ask').focus();return}
 t.ask={text,at:new Date().toISOString(),status:'open'};
 save();closeAskModal();render();
}
function clearAskFromModal(){
 const t=S.tasks.find(x=>x.id===askingId);if(!t)return;
 if(t.ask){t.ask={...t.ask,status:'cleared',clearedAt:new Date().toISOString()}}
 save();closeAskModal();render();
}
$('askCanBtn').onclick=closeAskModal;
$('askSaveBtn').onclick=saveAskFromModal;
$('askClearBtn').onclick=clearAskFromModal;
$('askOv').onclick=e=>{if(e.target.id==='askOv')closeAskModal()};

$('imp').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 f.text().then(t=>{try{const d=JSON.parse(t);if(!d.tasks||!d.columns)throw 0;S=migrate(d);save({force:true});render()}catch(x){alert('That file is not a board export.')}});
 e.target.value='';
};
$('resetBtn').onclick=async ()=>{
 if(!confirm('Reload the board from the live server? Unsaved local-only edits may be lost.'))return;
 setSync('saving','Loading…');
 const ok=await pullRemote();
 if(!ok){
  const cached=loadCached();
  if(cached){S=cached;render()}
  alert('Could not reach live server. Showing cache/seed.');
 }
};

let dragId=null;
document.addEventListener('dragstart',e=>{
 const c=e.target.closest('.card');if(!c)return;
 dragId=c.dataset.id;c.classList.add('dragging');
 e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);
});
document.addEventListener('dragend',e=>{
 document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
 document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
});
document.addEventListener('dragover',e=>{
 const l=e.target.closest('.list');if(!l)return;
 e.preventDefault();
 document.querySelectorAll('.over').forEach(x=>x!==l&&x.classList.remove('over'));
 l.classList.add('over');
});
document.addEventListener('drop',e=>{
 const l=e.target.closest('.list');if(!l||!dragId)return;e.preventDefault();
 const t=S.tasks.find(x=>x.id===dragId);if(!t)return;
 const col=l.dataset.col;
 const cards=[...l.querySelectorAll('.card:not(.dragging)')];
 const after=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});
 const ids=cards.map(c=>c.dataset.id);const idx=after?ids.indexOf(after.dataset.id):ids.length;
 ids.splice(idx,0,dragId);
 t.column=col;t.done=(col==='done');
 ids.forEach((id,i)=>{const x=S.tasks.find(y=>y.id===id);if(x)x.order=i});
 dragId=null;save();render();
});

(async function boot(){
 const cached=loadCached();
 if(cached){S=cached}
 render();
 const ok=await pullRemote();
 if(!ok&&!cached){S=migrate(JSON.parse(JSON.stringify(SEED)));cacheLocal();render()}
 subscribeRemote();
 bootDone=true;
})();
</script>
</body></html>
